name: web

on:
  push:
    branches: [main]
    paths: ["web/**", "scripts/export_openapi.py", "app/**", ".github/workflows/web.yml"]
  pull_request:
    paths: ["web/**", "scripts/export_openapi.py", "app/**", ".github/workflows/web.yml"]

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # The committed web/openapi.json must match what the backend produces right now.
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: uv sync --extra dev
      - name: OpenAPI schema is current
        run: uv run python scripts/export_openapi.py --check

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Generated API client is current
        working-directory: web
        run: npm run gen:api:check
      - name: Lint
        working-directory: web
        run: npm run lint
      - name: Typecheck
        working-directory: web
        run: npm run typecheck
      - name: Unit tests
        working-directory: web
        run: npm test
      - name: Build
        working-directory: web
        run: npm run build
        env:
          # Build-time placeholders only. The proxy reads these at request time on the server.
          API_BASE_URL: http://127.0.0.1:8000
          AUDIT_API_KEY: ci-placeholder
