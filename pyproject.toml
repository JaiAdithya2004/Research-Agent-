[project]
name = "ai-visibility-audit-agent"
version = "0.1.0"
description = "AI visibility audit agent"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi",
    "pydantic>=2",
    "sqlalchemy[asyncio]",
    "alembic",
    "redis",
    "arq",
    "httpx",
    "uvicorn",
    "psycopg[binary]>=3",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["app", "tests"]

[tool.ruff.lint.isort]
# The ./alembic migrations folder would otherwise shadow the third-party package.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
# Test data tables (URLs, HTML, headers) read better unwrapped. App code keeps the limit.
"tests/**" = ["E501"]
